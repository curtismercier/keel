[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "PROJECT_NAME"              # rename to your project
version = "0.1.0"
description = "ONE LINE — what this is."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Curtis Mercier / Gravicity" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

# Importable packages live under packages/. One namespace; rename _template to your unit.
[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
pythonpath = ["packages"]
testpaths = ["packages"]
