name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" ruff
      - name: Lint
        run: ruff check packages || true    # advisory until the crew adopts a ruleset
      - name: Test
        run: pytest -q
